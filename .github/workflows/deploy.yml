name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /sport/
          VITE_API_URL: /sport
        run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check deploy credentials
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ -z "$SERVER_SSH_KEY" ] && [ -z "$SERVER_PASSWORD" ]; then
            echo "Add SERVER_SSH_KEY or SERVER_PASSWORD to repository secrets."
            exit 1
          fi

      - name: Deploy frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || '135.106.139.12' }}
          username: ${{ secrets.SERVER_USER || 'tvr' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            cd /home/tvr/sportzal/frontend
            git fetch origin main
            git reset --hard origin/main

            cd /home/tvr/fencing
            docker compose up -d --build --no-deps sport-frontend
            docker compose ps sport-frontend

            curl -fsS http://127.0.0.1/sport/ >/dev/null
